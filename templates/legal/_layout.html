{% extends 'base.html' %}
{% block content %}
<article class="py-6 space-y-5 legal-doc">
    <header class="space-y-1">
        <h1 class="text-3xl">{% block doc_title %}{% endblock %}</h1>
        <p class="text-sm text-ink-soft">
            {% block doc_version %}{% endblock %}
            {% if legal.effective %}Effective {{ legal.effective }}.{% endif %}
        </p>
    </header>
    {% block doc_body %}{% endblock %}
    {% include 'legal/_nav.html' %}
</article>
{% endblock %}
