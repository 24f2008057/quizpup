{% extends "base.html" %}

{% block content %}
<div class="px-5 py-8 sm:py-14">
    <div class="page-narrow">
        <div class="bg-surface border border-line p-6 sm:p-8 rounded-card elevate-sm space-y-5">
            <div class="space-y-2">
                <h1 class="text-2xl">Check your email</h1>
                <p class="text-sm text-ink-soft">We sent a 6-digit code to <strong class="text-ink">{{ email }}</strong>. Enter it to verify your account.</p>
            </div>

            {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
            <div role="alert" class="text-sm p-3 rounded-control font-medium bg-danger-bg border border-danger-line text-danger">{{ message }}</div>
            {% endfor %}
            {% endwith %}

            <form method="POST" class="space-y-4">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div>
                    <label class="field-label" for="otp">6-digit code</label>
                    <input class="field text-center text-2xl font-semibold tabular-nums" style="letter-spacing: 0.35em;" type="text" id="otp" name="otp" placeholder="000000" maxlength="6" pattern="\d{6}" inputmode="numeric" required autocomplete="one-time-code">
                </div>
                <button type="submit" class="btn-primary w-full font-semibold min-h-12 rounded-control text-base cursor-pointer">Verify email</button>
            </form>

            <form method="POST" action="/verify-email/resend" class="text-center">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <button type="submit" class="text-sm font-medium text-plum underline underline-offset-4 min-h-11 px-3 cursor-pointer">Send a new code</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
