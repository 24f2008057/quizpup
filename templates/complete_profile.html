{% extends 'base.html' %}
{% block content %}
<div class="px-5 py-8 sm:py-14">
    <div class="page-narrow">
        <div class="bg-surface border border-line p-6 sm:p-8 rounded-card elevate-sm space-y-5">
            <div class="flex items-center gap-4">
                <img src="{{ url_for('static', filename='images/mascot-happy-sitting.png') }}" class="h-14 w-auto object-contain shrink-0" alt="">
                <div>
                    <h1 class="text-2xl">Finish setting up</h1>
                    <p class="text-sm text-ink-soft mt-1">A few details and you are in.</p>
                </div>
            </div>

            {% with messages = get_flashed_messages() %}
            {% for message in messages %}
            <div role="alert" class="text-sm p-3 rounded-control font-medium bg-danger-bg border border-danger-line text-danger">{{ message }}</div>
            {% endfor %}
            {% endwith %}

            <form method="POST" class="space-y-4">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div>
                    <label class="field-label" for="email">Email</label>
                    <input class="field bg-sunken text-ink-soft" id="email" type="email" value="{{ pending.email }}" disabled>
                </div>
                <div>
                    <label class="field-label" for="username">Username</label>
                    <input class="field" id="username" type="text" name="username" required value="{{ pending.suggested_username }}" autocomplete="username">
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="field-label" for="first_name">First name</label>
                        <input class="field" id="first_name" type="text" name="first_name" required value="{{ pending.first_name }}" autocomplete="given-name">
                    </div>
                    <div>
                        <label class="field-label" for="last_name">Last name</label>
                        <input class="field" id="last_name" type="text" name="last_name" required value="{{ pending.last_name }}" autocomplete="family-name">
                    </div>
                </div>
<div class="space-y-3 pt-1">
                    <div class="flex items-start gap-3">
                        <input id="accept_terms" name="accept_terms" type="checkbox" required class="mt-1 h-5 w-5 shrink-0 accent-plum">
                        <label for="accept_terms" class="text-sm text-ink leading-snug">I agree to the <a href="{{ url_for('privacy.terms') }}" target="_blank" rel="noopener" class="text-plum font-semibold underline underline-offset-4">Terms of Service</a> and have read the <a href="{{ url_for('privacy.privacy_policy') }}" target="_blank" rel="noopener" class="text-plum font-semibold underline underline-offset-4">Privacy Policy</a>.</label>
                    </div>
                    {% include '_age_fields.html' %}
                </div>
                <button type="submit" class="btn-primary w-full font-semibold min-h-12 rounded-control text-base cursor-pointer">Finish setup</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
