{% extends 'base.html' %}
{% block content %}
<style>
    .quiz-toolbar {
        position: sticky;
        top: 3.25rem;
        z-index: 30;
        background-color: var(--color-surface);
        border: 1px solid var(--color-line);
    }
</style>
<div id="quiz-workspace" class="p-5">
<div class="quiz-layout">
<div class="space-y-6 min-w-0">
    <div class="quiz-toolbar p-4 rounded-panel elevate-sm space-y-3">
        <div class="flex justify-between items-center">
            <div>
                <h1 class="text-lg font-serif font-bold text-plum">{{ session.topic }}</h1>
                <span id="hint-status-label" class="text-xs text-plum/80 font-semibold "></span>
            </div>
            <div class="text-right">
                <div id="clock-display" role="timer" aria-label="Time remaining" class="text-xl tabular-nums font-bold text-plum">00:00</div>
                <p id="quiz-live" class="sr-only" role="status" aria-live="polite"></p>
            </div>
        </div>
        <div class="flex justify-between items-center pt-2.5 border-t border-line/30">
            <button id="quitExamBtn" onclick="quitExam()" class="px-3.5 py-1.5 bg-blush text-plum border border-line rounded-control text-xs font-semibold hover:bg-blush-deep active:bg-blush-deep active:scale-[0.97] transition duration-100 cursor-pointer">Quit Exam</button>
            <button id="headerSubmitBtn" onclick="confirmAndSubmitQuiz()" class="btn-primary px-4 py-1.5 rounded-control text-xs font-semibold cursor-pointer">Submit</button>
        </div>
    </div>

    <div id="questionCard" class="bg-surface border border-line p-6 rounded-card elevate-sm">
        <div id="question-header" class="text-sm font-bold text-rose-strong mb-2 "></div>
        <p id="question-body-text" class="text-base text-plum font-semibold mb-6"></p>
        
        <div id="options-box" class="space-y-2.5" role="radiogroup" aria-labelledby="question-body-text"></div>
        
        <div id="feedback-explanation-panel" class="mt-6 p-4 bg-blush border border-line rounded-panel hidden">
            <h2 class="text-xs font-bold text-plum mb-1">Explanation After Attempt</h2>
            <p id="explanation-text-string" class="text-sm text-plum leading-relaxed"></p>
        </div>
    </div>

    <div class="flex justify-between items-center flex-wrap gap-2">
        <button id="prevBtn" onclick="moveSlide(-1)" class="px-4 py-2 bg-blush text-plum border border-line rounded-control text-sm font-semibold hover:bg-blush-deep disabled:opacity-50 cursor-pointer">Previous</button>
        <div class="flex gap-2 flex-wrap justify-center basis-full order-last sm:basis-auto sm:order-none">
            <button id="clearBtn" onclick="clearCurrentChoice()" class="px-4 py-2 border border-line text-plum rounded-control text-sm font-medium hover:bg-blush/40 cursor-pointer">Clear Answer</button>
            <button id="markBtn" type="button" aria-pressed="false" onclick="toggleMark()" class="qp-mark-btn px-4 py-2 border border-line text-plum rounded-control text-sm font-medium hover:bg-blush/40 cursor-pointer">Mark for later</button>
            <button id="openPaletteBtn" type="button" onclick="openPalette()" class="qp-open-btn items-center px-4 py-2 border border-line text-plum rounded-control text-sm font-medium hover:bg-blush/40 cursor-pointer">Questions</button>
            <button id="hintTriggerBtn" onclick="requestHintPayload()" class="btn-accent px-4 py-2 rounded-control text-sm font-semibold elevate-sm hidden cursor-pointer">Hint</button>
        </div>
        <button id="nextBtn" onclick="moveSlide(1)" class="btn-primary px-4 py-2 rounded-control text-sm font-semibold elevate-sm cursor-pointer">Next</button>
    </div>
</div>

<aside class="quiz-aside" aria-labelledby="qp-title">
    <h2 id="qp-title" class="text-lg font-serif font-bold text-plum mb-3">Questions</h2>
    <nav aria-label="Question palette" data-palette-mount></nav>
</aside>
</div>
</div>

<dialog id="palette-sheet" class="qp-sheet" aria-labelledby="qp-sheet-title">
    <div class="flex items-center justify-between mb-3">
        <h2 id="qp-sheet-title" class="text-lg font-serif font-bold text-plum">Questions</h2>
        <button type="button" onclick="closePalette()" class="px-4 min-h-11 border border-line text-plum rounded-control text-sm font-semibold cursor-pointer">Close</button>
    </div>
    <nav aria-label="Question palette" data-palette-mount></nav>
</dialog>

<div class="mx-auto max-w-[44rem]">
<div id="analytics-report-card" class="hidden space-y-6 bg-surface border border-line p-6 rounded-card elevate-lg m-5">
    <h1 id="results-heading" tabindex="-1" class="text-2xl font-serif font-bold text-plum reveal-in">Quiz Summary Report</h1>
    <p class="text-lg font-semibold text-plum reveal-in">Total Score: <span id="score-data-val" class="font-black text-rose-strong text-2xl tabular-nums tracking-tight"></span></p>
    
    <div class="p-4 bg-blush border border-line rounded-panel reveal-in reveal-in-delay">
        <h2 class="text-xs font-bold text-plum mb-1">Improvement Suggestions</h2>
        <p id="recommendation-box-string" class="text-sm text-plum leading-relaxed"></p>
    </div>
    
    <div class="flex flex-col sm:flex-row gap-3 pt-2 reveal-in reveal-in-delay">
        <button onclick="revealExplanationsWorkflow()" class="btn-accent flex-1 font-semibold py-3 px-4 rounded-panel text-sm elevate-sm cursor-pointer text-center">Review Answers & Explanations</button>
        <a href="/home" class="btn-primary flex-1 font-semibold py-3 px-4 rounded-panel text-sm elevate-sm cursor-pointer text-center flex items-center justify-center gap-2">Go to Home</a>
    </div>
</div>
</div>


<script nonce="{{ csp_nonce() }}">
let questionDeck = [];
let cursor = 0;
let savedAnswers = {};
let secondsLeft = 0;
let clockLoop;
let reviewMode = false;
let globalExplanations = {};
let visitedIds = new Set();
let markedIds = new Set();

function revealResultsCard() {
    const card = document.getElementById('analytics-report-card');
    document.getElementById('quiz-workspace').classList.add('hidden');
    card.classList.remove('hidden');
    document.getElementById('results-heading').focus({ preventScroll: true });
    const nodes = card.querySelectorAll('.reveal-in');
    nodes.forEach(n => n.classList.remove('reveal-in-active'));
    // Double rAF: let the browser paint the opacity:0 start state first,
    // otherwise the transition to reveal-in-active can get coalesced away.
    requestAnimationFrame(() => {
        requestAnimationFrame(() => {
            nodes.forEach(n => n.classList.add('reveal-in-active'));
        });
    });
}

async function startEngine() {
    const res = await fetch('/api/quiz/{{ session.id }}/questions');
    const data = await res.json();
    questionDeck = data.questions;
    savedAnswers = data.saved_answers || {};
    visitedIds = new Set(data.visited_ids || []);
    markedIds = new Set(data.marked_ids || []);
    
    if (data.is_completed) {
        reviewMode = true;
        globalExplanations = data.explanations;
        
        document.getElementById('score-data-val').innerText = `${data.score} / ${data.total}`;
        document.getElementById('recommendation-box-string').innerText = data.recommendation;
        revealResultsCard();
    } else {
        secondsLeft = data.seconds_remaining !== undefined ? data.seconds_remaining : (data.duration * 60);
        configureHintsIndicator(data.difficulty, data.hints_remaining);
        beginClock();
        showQuestion();
    }
}

async function saveProgress() {
    if (reviewMode) return;
    try {
        await fetch('/api/quiz/{{ session.id }}/save-progress', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                answers: savedAnswers,
                seconds_remaining: secondsLeft,
                visited: Array.from(visitedIds),
                marked: Array.from(markedIds)
            })
        });
    } catch(e) {
        console.warn('Progress save failed:', e);
    }
}

window.addEventListener('beforeunload', () => {
    if (!reviewMode && questionDeck.length) {
        const form = new FormData();
        form.append('csrf_token', document.querySelector('meta[name="csrf-token"]')?.getAttribute('content') || '');
        form.append('payload', JSON.stringify({ answers: savedAnswers, seconds_remaining: secondsLeft, visited: Array.from(visitedIds), marked: Array.from(markedIds) }));
        navigator.sendBeacon('/api/quiz/{{ session.id }}/save-progress', form);
    }
});

function configureHintsIndicator(mode, total) {
    const lbl = document.getElementById('hint-status-label');
    const btn = document.getElementById('hintTriggerBtn');
    if(mode === 'easy') { lbl.innerText = "Hints: Unlimited"; btn.classList.remove('hidden'); }
    else if(mode === 'medium') { lbl.innerText = `Hints Left: ${total}`; btn.classList.remove('hidden'); }
    else { lbl.innerText = `Hints Disabled (${mode})`; btn.style.display = 'none'; }
}

function showQuestion() {
    if(!questionDeck.length) return;
    const item = questionDeck[cursor];
    if (!reviewMode) visitedIds.add(item.id);
    
    document.getElementById('question-header').innerText = `Question ${cursor + 1} of ${questionDeck.length}`;
    document.getElementById('question-body-text').innerText = item.question;
    
    let container = document.getElementById('options-box');
    container.innerHTML = '';
    
    ['1', '2', '3', '4'].forEach(indexId => {
        let isUserChoice = savedAnswers[item.id] == indexId;
        let selectedState = isUserChoice ? 'checked' : '';
        let disabledState = reviewMode ? 'disabled' : '';
        let row = document.createElement('label');
        let classString = "flex items-center justify-between p-3 border rounded-lg cursor-pointer text-sm transition font-medium relative ";
        let badgeHtml = "";
        
        if (reviewMode) {
            let correctOptionIndex = globalExplanations[item.id]?.correct;
            let isCorrectChoice = indexId == correctOptionIndex;
            
            if (isCorrectChoice) {
                classString += "border-success bg-success-bg text-success";
                badgeHtml = '<span class="bg-success text-white text-xs font-bold px-2 py-0.5 rounded elevate-sm">Correct</span>';
            } else if (isUserChoice && !isCorrectChoice) {
                classString += "border-danger bg-danger-bg text-danger";
                badgeHtml = '<span class="bg-danger text-white text-xs font-bold px-2 py-0.5 rounded elevate-sm">Wrong</span>';
            } else {
                classString += "border-line text-ink-soft";
            }
        } else {
            // Live active testing states
            classString += isUserChoice ? 'border-rose-strong bg-blush text-plum font-bold elevate-sm' : 'border-line/30 text-plum hover:bg-blush/30';
        }
        
        row.className = classString;
        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = String(str);
            return div.innerHTML;
        }

        row.innerHTML = `
            <div class="flex items-center gap-3">
                <input type="radio" name="opts-${item.id}" value="${indexId}" ${selectedState} ${disabledState} onchange="logSelection(${item.id}, ${indexId})" class="h-5 w-5 accent-plum">
                <span>${indexId}. ${escapeHtml(item[indexId])}</span>
            </div>
            ${badgeHtml}
        `;

        container.appendChild(row);
    });

    document.getElementById('prevBtn').disabled = cursor === 0;
    document.getElementById('nextBtn').innerText = cursor === questionDeck.length - 1 ? (reviewMode ? "Exit" : "Submit") : "Next";
    
    if (reviewMode) {
        const submitBtn = document.getElementById('headerSubmitBtn');
        if (submitBtn) submitBtn.style.display = 'none';
        const quitBtn = document.getElementById('quitExamBtn');
        if (quitBtn) quitBtn.innerText = 'Exit Review';
    }

    const markBtn = document.getElementById('markBtn');
    markBtn.style.display = reviewMode ? 'none' : '';
    markBtn.setAttribute('aria-pressed', String(markedIds.has(item.id)));
    renderPalette();

    const expPanel = document.getElementById('feedback-explanation-panel');
    if(reviewMode && globalExplanations[item.id]) {
        expPanel.classList.remove('hidden');
        document.getElementById('explanation-text-string').innerText = globalExplanations[item.id].explanation;
    } else {
        expPanel.classList.add('hidden');
    }
}

async function quitExam() {
    if (reviewMode) {
        window.location.href = '/home';
        return;
    }
    if (confirm("Are you sure you want to quit the exam? Your marked answers and remaining time will be saved.")) {
        await saveProgress();
        window.location.href = '/home';
    }
}

function confirmAndSubmitQuiz() {
    if (confirm("Are you sure you want to submit your quiz?")) {
        completeQuizSession();
    }
}


function logSelection(qId, idx) { 
    if(reviewMode) return;
    savedAnswers[qId] = idx; 
    showQuestion();
    document.querySelector('#options-box input:checked')?.focus();
    saveProgress();
}

function clearCurrentChoice() {
    if(reviewMode) return;
    const item = questionDeck[cursor];
    delete savedAnswers[item.id];
    showQuestion();
    document.querySelector('#options-box input')?.focus();
    saveProgress();
}

function moveSlide(offset) {
    if(offset === 1 && cursor === questionDeck.length - 1) { 
        if(reviewMode) { window.location.href = '/home'; } else { completeQuizSession(); }
        return; 
    }
    cursor += offset;
    // Fast, subtle crossfade — this fires many times per session, so it must
    // read as instant, not as a transition. Answer-selection re-renders
    // (logSelection/clearCurrentChoice) intentionally skip this and stay sync.
    const card = document.getElementById('questionCard');
    card.classList.add('fade-fast', 'fade-fast-out');
    setTimeout(() => {
        showQuestion();
        card.classList.remove('fade-fast-out');
        document.getElementById('question-body-text').setAttribute('tabindex', '-1');
        document.getElementById('question-body-text').focus({ preventScroll: true });
    }, 120);
}

async function requestHintPayload() {
    const item = questionDeck[cursor];
    const res = await fetch(`/api/quiz/{{ session.id }}/hint/${item.id}`, { method: 'POST' });
    const data = await res.json();
    if(data.hint) { alert("Hint Details: " + data.hint); if(data.hints_remaining!==undefined) configureHintsIndicator('medium', data.hints_remaining); }
    else { alert(data.error); }
}

function beginClock() {
    const view = document.getElementById('clock-display');
    clockLoop = setInterval(() => {
        if(secondsLeft <= 0) { clearInterval(clockLoop); completeQuizSession(); return; }
        secondsLeft--;
        let m = Math.floor(secondsLeft / 60).toString().padStart(2, '0');
        let s = (secondsLeft % 60).toString().padStart(2, '0');
        view.innerText = `${m}:${s}`;
        if (secondsLeft === 300 || secondsLeft === 60 || secondsLeft === 30) {
            const live = document.getElementById('quiz-live');
            if (live) live.innerText = secondsLeft >= 60 ? `${secondsLeft / 60} minute${secondsLeft === 60 ? '' : 's'} remaining` : `${secondsLeft} seconds remaining`;
        }
        
        if (secondsLeft % 5 === 0) {
            saveProgress();
        }
    }, 1000);
}


async function completeQuizSession() {
    clearInterval(clockLoop);
    const res = await fetch('/api/quiz/{{ session.id }}/submit', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ answers: savedAnswers })
    });
    const data = await res.json();
    try {
        const detail = await fetch('/api/quiz/{{ session.id }}/questions');
        globalExplanations = (await detail.json()).explanations || {};
    } catch (e) {
        globalExplanations = {};
    }
    
    document.getElementById('score-data-val').innerText = `${data.score} / ${data.total}`;
    document.getElementById('recommendation-box-string').innerText = data.recommendation;
    revealResultsCard();
}

function revealExplanationsWorkflow() {
    document.getElementById('analytics-report-card').classList.add('hidden');
    document.getElementById('quiz-workspace').classList.remove('hidden');
    reviewMode = true;
    cursor = 0;
    showQuestion();
}

function paletteState(q) {
    const answered = savedAnswers[q.id] !== undefined && savedAnswers[q.id] !== null;
    if (reviewMode) {
        if (!answered) return { state: 'unvisited', label: 'not answered' };
        const correct = globalExplanations[q.id] ? globalExplanations[q.id].correct : null;
        return String(savedAnswers[q.id]) === String(correct) ? { state: 'correct', label: 'correct' } : { state: 'wrong', label: 'wrong' };
    }
    if (markedIds.has(q.id)) return { state: 'marked', label: answered ? 'answered and marked for later' : 'marked for later', badge: answered };
    if (answered) return { state: 'answered', label: 'answered' };
    if (visitedIds.has(q.id)) return { state: 'visited', label: 'not answered' };
    return { state: 'unvisited', label: 'not visited' };
}

function renderPalette() {
    if (!questionDeck.length) return;
    const counts = { answered: 0, visited: 0, unvisited: 0, marked: 0, correct: 0, wrong: 0 };
    const dots = questionDeck.map((q, i) => {
        const s = paletteState(q);
        counts[s.state] += 1;
        const current = i === cursor;
        return `<li><button type="button" class="qp-dot" data-i="${i}" data-state="${s.state}"${s.badge ? ' data-badge="answered"' : ''}${current ? ' aria-current="true"' : ''} tabindex="${current ? 0 : -1}" aria-label="Question ${i + 1}: ${s.label}${current ? ', current' : ''}">${i + 1}</button></li>`;
    }).join('');
    const item = (state, text, n) => `<li><span class="qp-swatch" data-state="${state}" aria-hidden="true"></span>${text} (${n})</li>`;
    const legend = reviewMode
        ? item('correct', 'Correct', counts.correct) + item('wrong', 'Wrong', counts.wrong) + item('unvisited', 'Not answered', counts.unvisited)
        : item('answered', 'Answered', counts.answered + (counts.marked ? questionDeck.filter(q => markedIds.has(q.id) && savedAnswers[q.id] != null).length : 0)) + item('visited', 'Not answered', counts.visited) + item('unvisited', 'Not visited', counts.unvisited) + item('marked', 'Marked for later', counts.marked);
    document.querySelectorAll('[data-palette-mount]').forEach(mount => {
        mount.innerHTML = `<ul class="qp-legend" role="list">${legend}</ul><ul class="qp-grid" role="list">${dots}</ul>`;
    });
    const aside = document.querySelector('.quiz-aside');
    const cur = aside ? aside.querySelector('[aria-current="true"]') : null;
    if (cur && aside.offsetParent !== null) {
        const r = cur.getBoundingClientRect();
        const a = aside.getBoundingClientRect();
        if (r.top < a.top || r.bottom > a.bottom) aside.scrollTop += r.top - a.top - a.height / 2;
    }
}

function jumpTo(i) {
    if (i < 0 || i >= questionDeck.length) return;
    cursor = i;
    showQuestion();
    const sheet = document.getElementById('palette-sheet');
    if (sheet.open) sheet.close();
    const body = document.getElementById('question-body-text');
    body.setAttribute('tabindex', '-1');
    body.focus({ preventScroll: true });
    body.scrollIntoView({ block: 'nearest' });
}

function toggleMark() {
    if (reviewMode) return;
    const id = questionDeck[cursor].id;
    if (markedIds.has(id)) markedIds.delete(id); else markedIds.add(id);
    const on = markedIds.has(id);
    document.getElementById('markBtn').setAttribute('aria-pressed', String(on));
    document.getElementById('quiz-live').innerText = `Question ${cursor + 1} ${on ? 'marked for later' : 'unmarked'}`;
    renderPalette();
    saveProgress();
}

function openPalette() {
    const sheet = document.getElementById('palette-sheet');
    renderPalette();
    sheet.showModal();
    const cur = sheet.querySelector('[aria-current="true"]');
    if (cur) cur.scrollIntoView({ block: 'center' });
}

function closePalette() {
    document.getElementById('palette-sheet').close();
}

function initPalette() {
    document.querySelectorAll('[data-palette-mount]').forEach(mount => {
        mount.addEventListener('click', e => {
            const dot = e.target.closest('.qp-dot');
            if (dot) jumpTo(Number(dot.dataset.i));
        });
        mount.addEventListener('keydown', e => {
            const dot = e.target.closest('.qp-dot');
            if (!dot) return;
            const dots = Array.from(mount.querySelectorAll('.qp-dot'));
            const index = dots.indexOf(dot);
            const cols = dots.filter(d => d.offsetTop === dots[0].offsetTop).length || 1;
            const moves = { ArrowRight: 1, ArrowLeft: -1, ArrowDown: cols, ArrowUp: -cols };
            let target = null;
            if (e.key in moves) target = dots[index + moves[e.key]];
            else if (e.key === 'Home') target = dots[0];
            else if (e.key === 'End') target = dots[dots.length - 1];
            else return;
            e.preventDefault();
            if (!target) return;
            dot.tabIndex = -1;
            target.tabIndex = 0;
            target.focus();
        });
    });
    const sheet = document.getElementById('palette-sheet');
    sheet.addEventListener('click', e => { if (e.target === sheet) sheet.close(); });
}

window.onload = () => { initPalette(); startEngine(); };
</script>
{% endblock %}
